<svg xmlns="http://www.w3.org/2000/svg" width="1850" height="1350" viewBox="0 0 1850 1350">
  <defs>
    <style>
      .bg { fill: #f3f8f7; }
      .title { font: 700 34px Arial, sans-serif; fill: #064f94; }
      .subtitle { font: 600 18px Arial, sans-serif; fill: #24465e; }
      .table { fill: #ffffff; stroke: #064f94; stroke-width: 2.3; rx: 8; }
      .table.green { stroke: #087d43; }
      .head { fill: #064f94; }
      .head.green { fill: #087d43; }
      .name { font: 700 16px Arial, sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .col { font: 13px Consolas, 'Courier New', monospace; fill: #10233f; }
      .pk { font: 700 13px Consolas, 'Courier New', monospace; fill: #064f94; }
      .fk { font: 700 13px Consolas, 'Courier New', monospace; fill: #087d43; }
      .line { stroke: #49656f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .line.green { stroke: #087d43; }
      .label { font: 700 12px Arial, sans-serif; fill: #24465e; paint-order: stroke; stroke: #f3f8f7; stroke-width: 4px; }
      .legend-box { fill: #fff8df; stroke: #e2b93b; stroke-width: 2; rx: 8; }
      .legend { font: 600 14px Arial, sans-serif; fill: #5c4810; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#49656f"/>
    </marker>
  </defs>

  <rect class="bg" width="1850" height="1350"/>
  <text class="title" x="925" y="50" text-anchor="middle">Modèle relationnel / MPD</text>
  <text class="subtitle" x="925" y="82" text-anchor="middle">Base de données PostgreSQL - Application de gestion comptable agricole</text>

  <!-- Row 1 -->
  <g transform="translate(60 130)">
    <rect class="table" width="300" height="255"/>
    <rect class="head" width="300" height="38" rx="8"/>
    <text class="name" x="150" y="20">utilisateurs</text>
    <text class="pk" x="14" y="62">PK id : bigint</text>
    <text class="col" x="14" y="84">nom : varchar(100)</text>
    <text class="col" x="14" y="106">prenom : varchar(100)</text>
    <text class="col" x="14" y="128">email : varchar(150), unique</text>
    <text class="col" x="14" y="150">mot_de_passe : varchar</text>
    <text class="col" x="14" y="172">role : varchar(30)</text>
    <text class="col" x="14" y="194">actif : boolean</text>
    <text class="col" x="14" y="216">date_creation : timestamp</text>
  </g>

  <g transform="translate(470 130)">
    <rect class="table" width="310" height="185"/>
    <rect class="head" width="310" height="38" rx="8"/>
    <text class="name" x="155" y="20">campagnes_agricoles</text>
    <text class="pk" x="14" y="62">PK id : bigint</text>
    <text class="col" x="14" y="84">nom : varchar(120)</text>
    <text class="col" x="14" y="106">date_debut : date</text>
    <text class="col" x="14" y="128">date_fin : date</text>
    <text class="col" x="14" y="150">statut : varchar(30)</text>
  </g>

  <g transform="translate(900 130)">
    <rect class="table" width="330" height="235"/>
    <rect class="head" width="330" height="38" rx="8"/>
    <text class="name" x="165" y="20">parcelles</text>
    <text class="pk" x="14" y="62">PK id : bigint</text>
    <text class="col" x="14" y="84">nom : varchar(120)</text>
    <text class="col" x="14" y="106">superficie_ha : numeric(12,2)</text>
    <text class="col" x="14" y="128">localisation : varchar</text>
    <text class="col" x="14" y="150">type_sol : varchar(120)</text>
    <text class="col" x="14" y="172">type_irrigation : varchar(120)</text>
    <text class="col" x="14" y="194">description : text</text>
  </g>

  <g transform="translate(1390 130)">
    <rect class="table green" width="360" height="315"/>
    <rect class="head green" width="360" height="38" rx="8"/>
    <text class="name" x="180" y="20">cultures</text>
    <text class="pk" x="14" y="62">PK id : bigint</text>
    <text class="col" x="14" y="84">nom : varchar(120)</text>
    <text class="col" x="14" y="106">variete : varchar(120)</text>
    <text class="col" x="14" y="128">surface_ha : numeric(12,2)</text>
    <text class="col" x="14" y="150">date_semis : date</text>
    <text class="col" x="14" y="172">date_recolte_prevue : date</text>
    <text class="col" x="14" y="194">date_recolte_reelle : date</text>
    <text class="col" x="14" y="216">statut : varchar(30)</text>
    <text class="fk" x="14" y="238">FK campagne_id -> campagnes_agricoles.id</text>
    <text class="fk" x="14" y="260">FK parcelle_id -> parcelles.id</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(70 560)">
    <rect class="table green" width="365" height="255"/>
    <rect class="head green" width="365" height="38" rx="8"/>
    <text class="name" x="182" y="20">operations_agricoles</text>
    <text class="pk" x="14" y="62">PK id : bigint</text>
    <text class="col" x="14" y="84">type_operation : varchar(60)</text>
    <text class="col" x="14" y="106">date_operation : date</text>
    <text class="col" x="14" y="128">description : text</text>
    <text class="col" x="14" y="150">cout_main_oeuvre : numeric(14,2)</text>
    <text class="fk" x="14" y="172">FK culture_id -> cultures.id</text>
    <text class="fk" x="14" y="194">FK utilisateur_id -> utilisateurs.id</text>
    <text class="col" x="14" y="216">date_creation : timestamp</text>
  </g>

  <g transform="translate(535 560)">
    <rect class="table green" width="330" height="275"/>
    <rect class="head green" width="330" height="38" rx="8"/>
    <text class="name" x="165" y="20">recoltes</text>
    <text class="pk" x="14" y="62">PK id : bigint</text>
    <text class="col" x="14" y="84">date_recolte : date</text>
    <text class="col" x="14" y="106">quantite : numeric(14,2)</text>
    <text class="col" x="14" y="128">unite : varchar(30)</text>
    <text class="col" x="14" y="150">prix_unitaire : numeric(14,2)</text>
    <text class="col" x="14" y="172">montant_total : numeric(14,2)</text>
    <text class="col" x="14" y="194">observation : text</text>
    <text class="fk" x="14" y="216">FK culture_id -> cultures.id</text>
    <text class="fk" x="14" y="238">FK utilisateur_id -> utilisateurs.id</text>
  </g>

  <g transform="translate(960 560)">
    <rect class="table green" width="390" height="295"/>
    <rect class="head green" width="390" height="38" rx="8"/>
    <text class="name" x="195" y="20">depenses</text>
    <text class="pk" x="14" y="62">PK id : bigint</text>
    <text class="col" x="14" y="84">libelle : varchar(180)</text>
    <text class="col" x="14" y="106">montant : numeric(14,2)</text>
    <text class="col" x="14" y="128">date_depense : date</text>
    <text class="col" x="14" y="150">mode_paiement : varchar(50)</text>
    <text class="col" x="14" y="172">reference_piece : varchar(120)</text>
    <text class="fk" x="14" y="194">FK culture_id -> cultures.id</text>
    <text class="fk" x="14" y="216">FK categorie_id -> categories_depenses.id</text>
    <text class="fk" x="14" y="238">FK operation_agricole_id -> operations_agricoles.id</text>
    <text class="fk" x="14" y="260">FK utilisateur_id -> utilisateurs.id</text>
  </g>

  <g transform="translate(1450 560)">
    <rect class="table green" width="330" height="255"/>
    <rect class="head green" width="330" height="38" rx="8"/>
    <text class="name" x="165" y="20">recettes</text>
    <text class="pk" x="14" y="62">PK id : bigint</text>
    <text class="col" x="14" y="84">libelle : varchar(180)</text>
    <text class="col" x="14" y="106">montant : numeric(14,2)</text>
    <text class="col" x="14" y="128">date_recette : date</text>
    <text class="col" x="14" y="150">quantite : numeric(14,2)</text>
    <text class="col" x="14" y="172">unite : varchar(30)</text>
    <text class="col" x="14" y="194">prix_unitaire : numeric(14,2)</text>
    <text class="fk" x="14" y="216">FK culture_id -> cultures.id</text>
    <text class="fk" x="14" y="238">FK utilisateur_id -> utilisateurs.id</text>
  </g>

  <!-- Row 3 -->
  <g transform="translate(160 1010)">
    <rect class="table" width="330" height="145"/>
    <rect class="head" width="330" height="38" rx="8"/>
    <text class="name" x="165" y="20">categories_depenses</text>
    <text class="pk" x="14" y="62">PK id : bigint</text>
    <text class="col" x="14" y="84">nom : varchar(120), unique</text>
    <text class="col" x="14" y="106">description : text</text>
  </g>

  <g transform="translate(670 990)">
    <rect class="table" width="360" height="235"/>
    <rect class="head" width="360" height="38" rx="8"/>
    <text class="name" x="180" y="20">produits_stock</text>
    <text class="pk" x="14" y="62">PK id : bigint</text>
    <text class="col" x="14" y="84">nom : varchar(150)</text>
    <text class="col" x="14" y="106">type_produit : varchar(60)</text>
    <text class="col" x="14" y="128">unite : varchar(30)</text>
    <text class="col" x="14" y="150">quantite_disponible : numeric(14,2)</text>
    <text class="col" x="14" y="172">seuil_alerte : numeric(14,2)</text>
    <text class="col" x="14" y="194">prix_unitaire_moyen : numeric(14,2)</text>
    <text class="col" x="14" y="216">date_creation : timestamp</text>
  </g>

  <g transform="translate(1220 960)">
    <rect class="table" width="405" height="315"/>
    <rect class="head" width="405" height="38" rx="8"/>
    <text class="name" x="202" y="20">mouvements_stock</text>
    <text class="pk" x="14" y="62">PK id : bigint</text>
    <text class="col" x="14" y="84">type_mouvement : varchar(30)</text>
    <text class="col" x="14" y="106">quantite : numeric(14,2)</text>
    <text class="col" x="14" y="128">prix_unitaire : numeric(14,2)</text>
    <text class="col" x="14" y="150">date_mouvement : date</text>
    <text class="col" x="14" y="172">motif : varchar</text>
    <text class="fk" x="14" y="194">FK produit_stock_id -> produits_stock.id</text>
    <text class="fk" x="14" y="216">FK culture_id -> cultures.id</text>
    <text class="fk" x="14" y="238">FK operation_agricole_id -> operations_agricoles.id</text>
    <text class="fk" x="14" y="260">FK utilisateur_id -> utilisateurs.id</text>
    <text class="col" x="14" y="282">date_creation : timestamp</text>
  </g>

  <!-- Relations -->
  <path class="line" d="M780 222 C980 220 1210 220 1390 248"/>
  <text class="label" x="1040" y="205">campagnes_agricoles 1 -> N cultures</text>

  <path class="line" d="M1230 248 C1280 248 1325 248 1390 270"/>
  <text class="label" x="1260" y="235">parcelles 1 -> N cultures</text>

  <path class="line green" d="M1460 445 C1160 500 650 505 435 610"/>
  <text class="label" x="845" y="500">cultures 1 -> N operations_agricoles</text>

  <path class="line green" d="M1500 445 C1250 520 920 520 865 620"/>
  <text class="label" x="1040" y="535">cultures 1 -> N recoltes</text>

  <path class="line green" d="M1570 445 C1470 500 1320 510 1210 560"/>
  <text class="label" x="1320" y="510">cultures 1 -> N depenses</text>

  <path class="line green" d="M1660 445 C1690 495 1660 530 1620 560"/>
  <text class="label" x="1638" y="512">cultures 1 -> N recettes</text>

  <path class="line" d="M490 1068 C690 1040 830 920 1010 855"/>
  <text class="label" x="630" y="990">categories_depenses 1 -> N depenses</text>

  <path class="line" d="M1030 1110 C1110 1110 1155 1080 1220 1090"/>
  <text class="label" x="1075" y="1088">produits_stock 1 -> N mouvements_stock</text>

  <path class="line" d="M1390 445 C1365 620 1380 805 1425 960"/>
  <text class="label" x="1400" y="720">cultures 0..1 -> N mouvements_stock</text>

  <path class="line" d="M300 815 C520 910 830 935 1220 1115"/>
  <text class="label" x="600" y="930">operations_agricoles 0..1 -> N mouvements_stock</text>

  <path class="line" d="M435 730 C610 750 760 760 960 745"/>
  <text class="label" x="590" y="725">operations_agricoles 0..1 -> N depenses</text>

  <path class="line" d="M360 260 C440 480 300 470 260 560"/>
  <text class="label" x="250" y="485">utilisateurs 1 -> N opérations</text>

  <path class="line" d="M360 250 C520 440 610 450 660 560"/>
  <text class="label" x="505" y="430">utilisateurs 1 -> N récoltes</text>

  <path class="line" d="M360 235 C670 405 970 420 1085 560"/>
  <text class="label" x="735" y="395">utilisateurs 1 -> N dépenses</text>

  <path class="line" d="M360 215 C820 385 1420 370 1530 560"/>
  <text class="label" x="1005" y="360">utilisateurs 1 -> N recettes</text>

  <path class="line" d="M260 385 C490 730 815 950 1220 1160"/>
  <text class="label" x="560" y="830">utilisateurs 1 -> N mouvements_stock</text>

  <rect class="legend-box" x="60" y="1210" width="690" height="78"/>
  <text class="legend" x="80" y="1238">PK : clé primaire. FK : clé étrangère. Les tables vertes sont directement rattachées aux cultures.</text>
  <text class="legend" x="80" y="1264">Les colonnes enum sont stockées sous forme de varchar dans PostgreSQL.</text>
</svg>