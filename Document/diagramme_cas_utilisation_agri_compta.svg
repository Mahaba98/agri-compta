<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
  <defs>
    <style>
      .bg { fill: #f3f8f7; }
      .title { font: 700 34px Arial, sans-serif; fill: #064f94; }
      .subtitle { font: 600 18px Arial, sans-serif; fill: #24465e; }
      .actor-label { font: 700 17px Arial, sans-serif; fill: #10233f; text-anchor: middle; }
      .system { fill: #ffffff; stroke: #064f94; stroke-width: 3; rx: 18; }
      .system-title { font: 700 22px Arial, sans-serif; fill: #064f94; text-anchor: middle; }
      .usecase { fill: #ffffff; stroke: #087d43; stroke-width: 2.5; }
      .usecase-text { font: 600 15px Arial, sans-serif; fill: #10233f; text-anchor: middle; dominant-baseline: middle; }
      .line { stroke: #49656f; stroke-width: 2; fill: none; }
      .admin-line { stroke: #064f94; stroke-width: 2.4; fill: none; }
      .comptable-line { stroke: #087d43; stroke-width: 2.4; fill: none; }
      .note { fill: #fff8df; stroke: #e2b93b; stroke-width: 2; rx: 10; }
      .note-text { font: 600 14px Arial, sans-serif; fill: #5c4810; }
      .legend { font: 600 14px Arial, sans-serif; fill: #49656f; }
    </style>
  </defs>

  <rect class="bg" width="1500" height="980"/>
  <text class="title" x="750" y="55" text-anchor="middle">Diagramme de cas d'utilisation</text>
  <text class="subtitle" x="750" y="88" text-anchor="middle">Application de gestion comptable agricole - Touba Agoro</text>

