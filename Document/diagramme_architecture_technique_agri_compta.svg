<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
  <defs>
    <style>
      .bg { fill: #f3f8f7; }
      .title { font: 700 34px Arial, sans-serif; fill: #064f94; }
      .subtitle { font: 600 18px Arial, sans-serif; fill: #24465e; }
      .zone { fill: #ffffff; stroke: #d9e7e5; stroke-width: 2; rx: 14; }
      .zone-title { font: 700 16px Arial, sans-serif; fill: #567074; text-anchor: middle; }
      .box { fill: #ffffff; stroke: #064f94; stroke-width: 2.6; rx: 10; }
      .box.green { stroke: #087d43; }
      .box.yellow { stroke: #e2b93b; }
      .box-title { font: 700 20px Arial, sans-serif; fill: #10233f; text-anchor: middle; }
      .box-sub { font: 600 14px Arial, sans-serif; fill: #567074; text-anchor: middle; }
      .item { font: 600 14px Arial, sans-serif; fill: #10233f; }
      .arrow { stroke: #49656f; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .arrow.green { stroke: #087d43; }
      .arrow.blue { stroke: #064f94; }
      .label { font: 700 13px Arial, sans-serif; fill: #24465e; paint-order: stroke; stroke: #f3f8f7; stroke-width: 5px; text-anchor: middle; }
      .token { fill: #fff8df; stroke: #e2b93b; stroke-width: 2; rx: 8; }
      .token-text { font: 700 14px Arial, sans-serif; fill: #5c4810; text-anchor: middle; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#49656f"/>
    </marker>
  </defs>

  <rect class="bg" width="1500" height="980"/>
  <text class="title" x="750" y="52" text-anchor="middle">Diagramme d'architecture technique</text>
  <text class="subtitle" x="750" y="84" text-anchor="middle">Application de gestion comptable agricole - Angular, Spring Boot et PostgreSQL</text>

  <rect class="zone" x="60" y="135" width="310" height="690"/>
  <text class="zone-title" x="215" y="165">Couche utilisateur</text>

  <rect class="zone" x="430" y="135" width="335" height="690"/>
  <text class="zone-title" x="598" y="165">Couche présentation</text>

  <rect class="zone" x="825" y="135" width="395" height="690"/>
  <text class="zone-title" x="1022" y="165">Couche métier / API</text>

  <rect class="zone" x="1275" y="135" width="170" height="690"/>
  <text class="zone-title" x="1360" y="165">Données</text>

  <!-- User -->
  <g transform="translate(105 230)">
    <rect class="box" width="220" height="150"/>
    <text class="box-title" x="110" y="42">Utilisateur</text>
    <text class="box-sub" x="110" y="70">Navigateur web</text>
    <text class="item" x="26" y="105">- ADMIN</text>
    <text class="item" x="26" y="128">- AGRICULTEUR</text>
    <text class="item" x="26" y="151">- COMPTABLE</text>
  </g>

  <g transform="translate(105 490)">
    <rect class="box yellow" width="220" height="165"/>
    <text class="box-title" x="110" y="42">Session</text>
    <text class="box-sub" x="110" y="70">Connexion sécurisée</text>
    <text class="item" x="24" y="105">- Email</text>
    <text class="item" x="24" y="128">- Mot de passe</text>
    <text class="item" x="24" y="151">- Rôle utilisateur</text>
  </g>

  <!-- Frontend -->
  <g transform="translate(470 215)">
    <rect class="box" width="255" height="250"/>
    <text class="box-title" x="128" y="42">Frontend Angular</text>
    <text class="box-sub" x="128" y="70">Interface web</text>
    <text class="item" x="24" y="108">- Page de connexion</text>
    <text class="item" x="24" y="132">- Tableau de bord</text>
    <text class="item" x="24" y="156">- Formulaires CRUD</text>
    <text class="item" x="24" y="180">- Listes et rapports</text>
    <text class="item" x="24" y="204">- Stockage du token</text>
    <text class="item" x="24" y="228">- Envoi Authorization</text>
  </g>

  <g transform="translate(470 560)">
    <rect class="token" width="255" height="115"/>
    <text class="token-text" x="128" y="38">Token d'authentification</text>
    <text class="box-sub" x="128" y="66">localStorage</text>
    <text class="box-sub" x="128" y="91">Bearer token dans les requêtes</text>
  </g>

  <!-- Backend -->
  <g transform="translate(875 195)">
    <rect class="box green" width="290" height="165"/>
    <text class="box-title" x="145" y="42">API REST</text>
    <text class="box-sub" x="145" y="70">Spring Boot</text>
    <text class="item" x="28" y="106">- Controllers REST</text>
    <text class="item" x="28" y="130">- Validation DTO</text>
    <text class="item" x="28" y="154">- Réponses JSON / CSV</text>
  </g>

  <g transform="translate(875 420)">
    <rect class="box yellow" width="290" height="155"/>
    <text class="box-title" x="145" y="42">Authentification</text>
    <text class="box-sub" x="145" y="70">Filtre + token signé</text>
    <text class="item" x="28" y="106">- /api/auth/login</text>
    <text class="item" x="28" y="130">- Vérification Bearer</text>
    <text class="item" x="28" y="154">- Contrôle des rôles</text>
  </g>

  <g transform="translate(875 635)">
    <rect class="box green" width="290" height="150"/>
    <text class="box-title" x="145" y="42">Services métier</text>
    <text class="box-sub" x="145" y="70">Logique applicative</text>
    <text class="item" x="28" y="105">- Gestion agricole</text>
    <text class="item" x="28" y="129">- Comptabilité</text>
    <text class="item" x="28" y="153">- Stock, rapports, rentabilité</text>
  </g>

  <!-- DB -->
  <g transform="translate(1292 275)">
    <rect class="box" width="135" height="345"/>
    <text class="box-title" x="68" y="42">PostgreSQL</text>
    <text class="box-sub" x="68" y="70">Base de données</text>
    <text class="item" x="16" y="108">- utilisateurs</text>
    <text class="item" x="16" y="132">- campagnes</text>
    <text class="item" x="16" y="156">- parcelles</text>
    <text class="item" x="16" y="180">- cultures</text>
    <text class="item" x="16" y="204">- opérations</text>
    <text class="item" x="16" y="228">- récoltes</text>
    <text class="item" x="16" y="252">- dépenses</text>
    <text class="item" x="16" y="276">- recettes</text>
    <text class="item" x="16" y="300">- stocks</text>
  </g>

  <!-- Arrows -->
  <path class="arrow blue" d="M325 300 C380 300 420 300 470 300"/>
  <text class="label" x="398" y="282">HTTP / navigateur</text>

  <path class="arrow" d="M598 465 L598 560"/>
  <text class="label" x="650" y="520">stocke token</text>

  <path class="arrow green" d="M725 305 C785 305 820 280 875 280"/>
  <text class="label" x="800" y="260">API REST JSON</text>

  <path class="arrow" d="M725 615 C800 610 815 500 875 500"/>
  <text class="label" x="815" y="585">Authorization: Bearer</text>

  <path class="arrow" d="M1020 360 L1020 420"/>
  <text class="label" x="1080" y="395">filtre</text>

  <path class="arrow green" d="M1020 575 L1020 635"/>
  <text class="label" x="1085" y="610">accès autorisé</text>

  <path class="arrow blue" d="M1165 275 C1215 275 1245 360 1292 360"/>
  <text class="label" x="1238" y="315">JPA / Hibernate</text>

  <path class="arrow blue" d="M1165 710 C1230 700 1245 560 1292 535"/>
  <text class="label" x="1245" y="675">repositories</text>

  <path class="arrow" d="M215 490 L215 380"/>
  <text class="label" x="270" y="440">identifiants</text>

  <rect class="token" x="230" y="870" width="1040" height="70"/>
  <text class="token-text" x="750" y="898">Principe : Angular consomme les API sécurisées et affiche les données agricoles, comptables et les rapports filtrés.</text>
  <text class="box-sub" x="750" y="924">ADMIN et COMPTABLE peuvent exporter les rapports en CSV compatible Excel ou les enregistrer en PDF.</text>
</svg>
